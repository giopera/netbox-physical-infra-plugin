{% extends 'generic/object.html' %}
{% load helpers %}

{% block content %}
<div class="card my-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">
      <i class="mdi mdi-vector-polyline"></i> Cable & Conduit Path Trace
    </h5>
    <a class="btn btn-sm btn-primary" href="{% url 'plugins:netbox_physical_infra_plugin:cable_trace_download' pk=object.pk %}">
      <i class="mdi mdi-download" aria-hidden="true"></i>
      Download SVG
    </a>
  </div>
  <div class="card-body text-center overflow-auto bg-body-tertiary">
    <!-- SVG Container -->
    <div class="d-inline-block p-3 border rounded bg-white shadow-sm">
      {{ svg_content }}
    </div>
  </div>
</div>
{% endblock %}
